name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + test come from forge's shared reusable workflow (ADR-0006).
  ci:
    uses: adaouat/forge/.github/workflows/go-ci.yml@bd62534b076de2663581892c16b23849bb49c2a0 # v0.17.1
    with:
      coverage-threshold: 85

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Setup Mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
      - name: Build
        run: go build ./cmd/hermes/

  # hermes's domain (Alfred/Raycast/JetBrains .app bundles) is macOS-only, but the `ci`/
  # `build` jobs above run on ubuntu-latest — nothing so far actually builds or tests on the
  # real target OS (roadmap M7). macos-15/-intel are the current generation still shipping an
  # Intel image (GA'd through Fall 2027); macos-26/-intel is the latest (GA since 2026-02).
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      # hk has no darwin/amd64 build (only linux, darwin/arm64, windows), so the full
      # `.config/mise/config.toml` tool set fails `mise install` outright on the Intel macOS
      # legs. This job only ever runs `go test`/`go build`, so install_args scopes it to just
      # `go` - a CI-only restriction; local dev and every other job still install the full set.
      - name: Setup Mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: go
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/hermes/

  # The reusable `ci` job only runs golangci-lint, but all linting is configured in hk
  # (.config/hk/config.pkl) — actionlint, yamlfmt, typos, pkl, go fmt, … — and the local
  # pre-commit hook only sees staged files, so those never reach CI. Run the full hk set
  # here (check mode, all files; --skip-step golangci_lint avoids re-running it).
  hk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
      - name: hk check
        run: hk check --all --check --skip-step golangci_lint
