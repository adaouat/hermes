# yaml-language-server: $schema=https://raw.githubusercontent.com/adaouat/heraut/v0.58.0/schema.json

version: "1"
versioning:
  strategy: semver
  tag_prefix: v

changelog:
  output: CHANGELOG.md

forges:
  - name: GitHub
    platform: github
    repository: adaouat/hermes
    token_env: GH_TOKEN

release:
  notes: {}
  targets:
    - forge: GitHub
  assets:
    - "dist/hermes_*_darwin_amd64"
    - "dist/hermes_*_darwin_arm64"
    # homebrew archive — the cask's url.template points at these
    - "dist/hermes_*_darwin_amd64.tar.gz"
    - "dist/hermes_*_darwin_arm64.tar.gz"
    - "dist/checksums.txt"
    - "dist/packslip.sigstore.json"
    - "dist/*.sbom.json"
